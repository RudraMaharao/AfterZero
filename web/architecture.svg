<title id="title">AfterZero serverless architecture</title><desc id="desc">API Gateway and S3 manifests enter Lambda; Lambda saves state in DynamoDB; DynamoDB Streams and Lambda dispatch Step Functions, which archives evidence in S3 and delivers to a consumer inbox</desc>
